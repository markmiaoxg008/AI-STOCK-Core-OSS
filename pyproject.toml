[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-market-data-core"
version = "0.1.0"
description = "Independent public market-data validation utilities"
requires-python = ">=3.9"
license = "MIT"

[tool.setuptools.packages.find]
include = ["market_data_core*"]
